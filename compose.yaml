services:
  platform:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    init: true
    volumes:
      - platform-data:/app/data
    restart: unless-stopped
volumes:
  platform-data:
